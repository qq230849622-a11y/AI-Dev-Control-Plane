name: AICTRL PRE-003 retained-session diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: aictrl-pre003-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.repository == 'qq230849622-a11y/AI-Dev-Control-Plane' &&
      github.actor == 'qq230849622-a11y' &&
      github.event.issue.number == 7 &&
      github.event.action == 'created' &&
      startsWith(github.event.comment.body, 'AICTRL_PRE003_DIAG_V1')
    runs-on: [self-hosted, Windows, X64, aictrl-win]
    timeout-minutes: 5
    steps:
      - name: Check out trusted master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Inspect retained R4 session without launching an agent
        shell: powershell
        run: >-
          python scripts/aictrl_pre003_diag.py
          --event "$env:GITHUB_EVENT_PATH"
          --target-event-id "pre003-final-r4-20260901-0727-6f18d70c"
          --output "$env:RUNNER_TEMP\aictrl-pre003-diag.txt"

      - name: Post bounded diagnostic result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: >-
          gh issue comment 7
          --repo qq230849622-a11y/AI-Dev-Control-Plane
          --body-file "$env:RUNNER_TEMP\aictrl-pre003-diag.txt"
