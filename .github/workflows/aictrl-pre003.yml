name: AICTRL PRE-003 probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: aictrl-pre003
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == 'qq230849622-a11y/AI-Dev-Control-Plane' &&
      github.actor == 'qq230849622-a11y' &&
      github.event.issue.number == 7 &&
      github.event.action == 'created'
    runs-on: [self-hosted, Windows, X64, aictrl-win]
    timeout-minutes: 15
    steps:
      - name: Check out the trusted default branch
        # actions/checkout v4.2.2, pinned to the official immutable release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch existing issue comments for idempotency
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: >-
          gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/issues/7/comments" |
          Set-Content -LiteralPath "$env:RUNNER_TEMP\aictrl-pre003-comments.json" -Encoding utf8

      - name: Admit exactly one bound PRE-003 PING
        id: admit
        shell: powershell
        run: >-
          python scripts/aictrl_pre003_admit.py
          --event "$env:GITHUB_EVENT_PATH"
          --comments "$env:RUNNER_TEMP\aictrl-pre003-comments.json"
          --output "$env:GITHUB_OUTPUT"

      - name: Fail closed on an invalid PING
        if: steps.admit.outputs.admitted != 'true'
        shell: powershell
        run: >-
          throw "PRE-003 admission rejected: ${{ steps.admit.outputs.reason }}"

      - name: Stop on a duplicate PONG
        if: steps.admit.outputs.duplicate == 'true'
        shell: powershell
        run: Write-Output 'PRE-003 duplicate event; no AO worker started.'

      - name: Run the read-only Luna probe
        id: probe
        if: steps.admit.outputs.admitted == 'true' && steps.admit.outputs.duplicate != 'true'
        shell: powershell
        env:
          PRE003_EVENT_ID: ${{ steps.admit.outputs.event_id }}
        run: >-
          python scripts/aictrl_pre003_probe.py
          --event-id "$env:PRE003_EVENT_ID"
          --output "$env:GITHUB_OUTPUT"

      - name: Post bounded PRE-003 failure
        if: >-
          always() &&
          steps.admit.outputs.admitted == 'true' &&
          steps.admit.outputs.duplicate != 'true' &&
          (steps.probe.outcome == 'failure' || steps.probe.outputs.status != 'PASS')
        env:
          GH_TOKEN: ${{ github.token }}
          PRE003_EVENT_ID: ${{ steps.admit.outputs.event_id }}
          PRE003_REASON: ${{ steps.probe.outputs.reason || 'PROBE_RUNTIME_ERROR' }}
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRE003_REASON)) {
            $env:PRE003_REASON = 'PROBE_RUNTIME_ERROR'
          }
          $body = @"
          AICTRL_PRE003_FAIL_V1
          project_key: AI_DEV_CONTROL_PLANE
          repo: qq230849622-a11y/AI-Dev-Control-Plane
          event_id: $env:PRE003_EVENT_ID
          runner: AICTRL-WIN11
          model: gpt-5.6-luna
          reason: $env:PRE003_REASON
          status: FAIL
          "@
          gh issue comment 7 --repo qq230849622-a11y/AI-Dev-Control-Plane --body $body
          exit 1

      - name: Post PRE-003 PONG
        if: steps.admit.outputs.admitted == 'true' && steps.admit.outputs.duplicate != 'true' && steps.probe.outputs.status == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          PRE003_EVENT_ID: ${{ steps.admit.outputs.event_id }}
          PRE003_SESSION_ID: ${{ steps.probe.outputs.session_id }}
          PRE003_RESULT_MARKER: ${{ steps.probe.outputs.result_marker }}
          PRE003_MAIN_HEAD: ${{ steps.probe.outputs.main_head }}
          PRE003_WORKTREE_PATH: ${{ steps.probe.outputs.worktree_path }}
        shell: powershell
        run: |
          $body = @"
          AICTRL_PRE003_PONG_V1
          project_key: AI_DEV_CONTROL_PLANE
          repo: qq230849622-a11y/AI-Dev-Control-Plane
          event_id: $env:PRE003_EVENT_ID
          runner: AICTRL-WIN11
          model: gpt-5.6-luna
          session_id: $env:PRE003_SESSION_ID
          result_marker: $env:PRE003_RESULT_MARKER
          main_head: $env:PRE003_MAIN_HEAD
          main_unchanged: true
          worktree_path: $env:PRE003_WORKTREE_PATH
          worktree_isolated: true
          status: PASS
          "@
          gh issue comment 7 --repo qq230849622-a11y/AI-Dev-Control-Plane --body $body
