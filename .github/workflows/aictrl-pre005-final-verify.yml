name: AICTRL PRE-005 final no-model verification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aictrl-pre005-final-verify
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'qq230849622-a11y/AI-Dev-Control-Plane' &&
      github.actor == 'qq230849622-a11y' &&
      github.event.issue.number == 29 &&
      github.event.action == 'created' &&
      startsWith(github.event.comment.body, 'AICTRL_PRE005_FINAL_VERIFY_V1')
    runs-on: [self-hosted, Windows, X64, aictrl-win]
    timeout-minutes: 20
    steps:
      - name: Initialize verification result
        shell: powershell
        run: |
          "AICTRL_PRE005_FINAL_VERIFY_RESULT_V1`nstatus: FAIL`nreason: NOT_COMPLETED" | Set-Content -LiteralPath "$env:RUNNER_TEMP\aictrl-pre005-final-verify.txt" -Encoding utf8

      - name: Check out trusted controller code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller

      - name: Check out exact PRE-005 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: aictrl/pre-005
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Run focused and full no-model verification
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          PYTHONDONTWRITEBYTECODE: '1'
        shell: powershell
        run: >-
          python controller/scripts/aictrl_pre005_final_verify.py
          --event "$env:GITHUB_EVENT_PATH"
          --candidate "$env:GITHUB_WORKSPACE\candidate"
          --result "$env:RUNNER_TEMP\aictrl-pre005-final-verify.txt"

      - name: Post final verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $result = "$env:RUNNER_TEMP\aictrl-pre005-final-verify.txt"
          if (!(Test-Path -LiteralPath $result)) { throw "PRE-005 final verify result missing" }
          gh issue comment 29 --repo qq230849622-a11y/AI-Dev-Control-Plane --body-file $result
          if ('${{ steps.verify.outcome }}' -ne 'success') { exit 1 }
