name: AICTRL PRE-005 R1 no-model diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: aictrl-pre005-r1-diag
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.repository == 'qq230849622-a11y/AI-Dev-Control-Plane' &&
      github.actor == 'qq230849622-a11y' &&
      github.event.issue.number == 29 &&
      github.event.action == 'created' &&
      github.event.comment.body == 'AICTRL_PRE005_R1_DIAG_V1\nproject_key: AI_DEV_CONTROL_PLANE\nrepo: qq230849622-a11y/AI-Dev-Control-Plane\ntask_id: PRE-005\nprobe: worktree-state'
    runs-on: [self-hosted, Windows, X64, aictrl-win]
    timeout-minutes: 10
    steps:
      - name: Initialize diagnostic result
        shell: powershell
        run: |
          "AICTRL_PRE005_R1_DIAG_RESULT_V1`nstatus: FAIL`nreason: NOT_COMPLETED" | Set-Content -LiteralPath "$env:RUNNER_TEMP\aictrl-pre005-r1-diag.txt" -Encoding utf8

      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Inspect AO and Git worktree state without model
        id: diagnose
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        shell: powershell
        run: >-
          python -m scripts.aictrl_pre005_r1_diag
          --event "$env:GITHUB_EVENT_PATH"
          --result "$env:RUNNER_TEMP\aictrl-pre005-r1-diag.txt"

      - name: Post diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $result = "$env:RUNNER_TEMP\aictrl-pre005-r1-diag.txt"
          if (!(Test-Path -LiteralPath $result)) { throw "PRE-005 diagnostic result missing" }
          gh issue comment 29 --repo qq230849622-a11y/AI-Dev-Control-Plane --body-file $result
          if ('${{ steps.diagnose.outcome }}' -ne 'success') { exit 1 }
