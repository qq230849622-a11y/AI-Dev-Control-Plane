name: AICTRL PRE-005 retained worktree cleanup

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: aictrl-pre005-worktree-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'qq230849622-a11y/AI-Dev-Control-Plane' &&
      github.actor == 'qq230849622-a11y' &&
      github.event.issue.number == 29 &&
      github.event.action == 'created' &&
      startsWith(github.event.comment.body, 'AICTRL_PRE005_WORKTREE_CLEANUP_V1')
    runs-on: [self-hosted, Windows, X64, aictrl-win]
    timeout-minutes: 10
    steps:
      - name: Initialize cleanup result
        shell: powershell
        run: |
          "AICTRL_PRE005_WORKTREE_CLEANUP_RESULT_V1`nstatus: FAIL`nreason: NOT_COMPLETED" | Set-Content -LiteralPath "$env:RUNNER_TEMP\aictrl-pre005-cleanup.txt" -Encoding utf8

      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reclaim only verified disposable PRE-005 worktree residue
        id: cleanup
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        shell: powershell
        run: >-
          python -m scripts.aictrl_pre005_worktree_cleanup
          --event "$env:GITHUB_EVENT_PATH"
          --result "$env:RUNNER_TEMP\aictrl-pre005-cleanup.txt"

      - name: Post cleanup result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $result = "$env:RUNNER_TEMP\aictrl-pre005-cleanup.txt"
          if (!(Test-Path -LiteralPath $result)) { throw "PRE-005 cleanup result missing" }
          gh issue comment 29 --repo qq230849622-a11y/AI-Dev-Control-Plane --body-file $result
          if ('${{ steps.cleanup.outcome }}' -ne 'success') { exit 1 }
