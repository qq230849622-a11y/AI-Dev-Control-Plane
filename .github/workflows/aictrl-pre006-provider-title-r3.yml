name: AICTRL PRE-006 provider-title R3

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aictrl-pre006-provider-title-r3
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'qq230849622-a11y/AI-Dev-Control-Plane' &&
      github.actor == 'qq230849622-a11y' &&
      github.event.issue.number == 48 &&
      github.event.action == 'created' &&
      startsWith(github.event.comment.body, 'AICTRL_PRE006_PROVIDER_TITLE_R3_START_V1')
    runs-on: [self-hosted, Windows, X64, aictrl-win]
    timeout-minutes: 45
    steps:
      - name: Initialize bounded R3 result
        shell: powershell
        run: |
          @"
          AICTRL_PRE006_PROVIDER_TITLE_R3_RESULT_V1
          project_key: AI_DEV_CONTROL_PLANE
          repo: qq230849622-a11y/AI-Dev-Control-Plane
          task_id: PRE-006-FIX-R3
          model: gpt-5.6-terra
          session_id:
          worker_head:
          pr_number: 51
          pr_url: https://github.com/qq230849622-a11y/AI-Dev-Control-Plane/pull/51
          reason: R3_NOT_COMPLETED
          status: FAIL
          "@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\aictrl-pre006-provider-title-r3.txt" -Encoding utf8

      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run bounded Terra provider-title R3
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          PYTHONDONTWRITEBYTECODE: '1'
        shell: powershell
        run: >-
          python -m scripts.aictrl_pre006_provider_title_r3
          --event "$env:GITHUB_EVENT_PATH"
          --result "$env:RUNNER_TEMP\aictrl-pre006-provider-title-r3.txt"

      - name: Post bounded R3 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $result = "$env:RUNNER_TEMP\aictrl-pre006-provider-title-r3.txt"
          if (!(Test-Path -LiteralPath $result)) { throw "PRE-006 provider-title R3 result missing" }
          gh issue comment 48 --repo qq230849622-a11y/AI-Dev-Control-Plane --body-file $result
          if ('${{ steps.repair.outcome }}' -ne 'success') { exit 1 }
