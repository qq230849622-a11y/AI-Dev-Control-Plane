name: Create v0.1.0 release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 2
      - name: Create release from clean master
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HEAD_MESSAGE" != "release: v0.1.0 create" ]]; then
            echo "Not the one-shot release commit; skipping."
            exit 0
          fi
          clean_sha="$(git rev-parse HEAD^)"
          notes="$(sed -n '/^## \[0.1.0\]/,$p' CHANGELOG.md)"
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$clean_sha" \
            --title "AI Dev Control Plane v0.1.0" \
            --notes "$notes"
