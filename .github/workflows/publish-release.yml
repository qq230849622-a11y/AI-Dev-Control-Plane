name: Publish v0.1.0 release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release: v0.1.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 already exists"
            exit 0
          fi
          notes="$(sed -n '/^## \\[0.1.0\\]/,$p' CHANGELOG.md)"
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AI Dev Control Plane v0.1.0" \
            --notes "$notes"
