[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-control-plane"
version = "0.1.0"
description = "A fail-closed control plane for bounded coding-agent workflows."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/qq230849622-a11y/AI-Dev-Control-Plane"
Repository = "https://github.com/qq230849622-a11y/AI-Dev-Control-Plane"
Issues = "https://github.com/qq230849622-a11y/AI-Dev-Control-Plane/issues"

[project.scripts]
aictrl = "aictrl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"ai_dev_control_plane/schemas/v1" = [
    "schemas/v1/task.schema.json",
    "schemas/v1/event.schema.json",
    "schemas/v1/decision.schema.json",
    "schemas/v1/project.schema.json",
    "schemas/v1/result.schema.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
